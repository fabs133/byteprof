[project]
name = "byteprof"
version = "1.0.0"
description = "Per-component latency profiling for byte-level language models"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Fabio-Eric Rempel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["real_tokenizer: needs the Bolmo tokenizer in the local HF cache (skipped otherwise)"]
