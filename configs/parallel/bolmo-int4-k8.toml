# Bolmo 1B, graph-global + minimal loop, int4, drafting kind = combined, k_max = 8
model_id = "allenai/Bolmo-1B"
revision = "452690a8cfab1dd1ec27b74f2667632f17a21b46"
dtype = "bfloat16"
device = "cuda"
prompts_file = "prompts/default.jsonl"
max_new_bytes = 256
warmup_runs = 10
measured_runs = 5
seed = 1234
output_dir = "results/parallel/int4-k8"
optimize = "cuda_graph"
optimize_global = true
decode_loop = "minimal"
compile_backend = "inductor"

[quantize]
target = "all"
scheme = "int4_wo"
group_size = 128

[draft]
kind = "combined"
ks = [0, 1, 2, 4, 6, 8]
k_max = 8
min_len = 3
min_count = 1
max_order = 6
