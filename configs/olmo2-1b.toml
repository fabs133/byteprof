# Token-model baseline: OLMo 2 1B, the source model Bolmo 1B was byteified from.
# Same harness, prompts, seed and dtype as configs/bolmo-1b.toml, so the two
# reports compare on "ms per generated byte".
#
# BEST-GUESS patterns for the standard transformers Olmo2ForCausalLM layout.
# Verify with `python -m byteprof discover --config configs/olmo2-1b.toml` and
# pin `revision` once it works.

model_id = "allenai/OLMo-2-0425-1B"
revision = "a1847dff35000b4271fa70afc5db10fd29fedbdf"
dtype = "bfloat16"
device = "cuda"
prompts_file = "prompts/default.jsonl"
# Passed to generate() as max_new_tokens, so the unit here is TOKENS, not bytes.
# Tuned with `inspect` so the mean bytes per run match Bolmo at max_new_bytes = 256
# (Bolmo now produces exactly 256 new bytes per run). 64 tokens gave a mean of
# 227.6 bytes, 72 tokens give 258.6 (388/288/292/172/153 across the five prompts).
max_new_bytes = 72
warmup_runs = 2
measured_runs = 5
seed = 1234
output_dir = "results"

# HF generate() calls the top-level model once per step.
step_module = ""

# Component names match the Bolmo config where the role is the same
# ("global_model" = the transformer stack, "lm_head" = output projection).
[components]
embed = ['^model\.embed_tokens$']
global_model = ['^model\.layers\.\d+$']
final_norm = ['^model\.norm$']
lm_head = ['^lm_head$']
